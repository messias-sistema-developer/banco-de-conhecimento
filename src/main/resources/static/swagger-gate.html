<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swagger - confirmar senha</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial, sans-serif; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  }
  .card {
    background:#fff; border-radius:16px; padding:48px 40px; width:380px;
    box-shadow:0 24px 60px rgba(0,0,0,.45); text-align:center;
  }
  .card h1 { color:#1d3557; font-size:24px; margin-bottom:6px; }
  .card p.sub { color:#6c757d; margin-bottom:28px; font-size:14px; line-height:1.5; }
  .card label { display:block; color:#495057; font-size:13px; font-weight:600;
    margin:14px 0 6px; text-align:left; }
  .card input {
    width:100%; padding:12px 14px; border:1.5px solid #dee2e6; border-radius:10px;
    font-size:15px; outline:none; transition:border-color .2s;
  }
  .card input:focus { border-color:#2c5364; }
  .card button {
    width:100%; margin-top:24px; padding:13px; border:none; border-radius:10px;
    background:linear-gradient(135deg,#203a43,#2c5364); color:#fff; font-size:16px;
    font-weight:600; cursor:pointer; transition:transform .15s;
  }
  .card button:hover { transform:translateY(-1px); }
  .erro {
    display:none; margin-top:16px; padding:11px; border-radius:8px;
    background:#fdecea; color:#c0392b; font-size:13px;
  }
  .voltar { display:inline-block; margin-top:20px; color:#6c757d; font-size:12.5px; }
</style>
</head>
<body>
  <form class="card" id="formGate">
    <h1>&#128274; Swagger protegido</h1>
    <p class="sub">Confirme a senha do administrador para liberar swagger</p>

    <label for="senha">Senha do administrador</label>
    <input id="senha" type="password" autocomplete="current-password" required autofocus>

    <button type="submit">Liberar Swagger</button>
    <div class="erro" id="msgErro"></div>
    <a class="voltar" href="/app.html">Voltar ao painel</a>
  </form>

<script>
document.getElementById('formGate').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msgErro');
  msg.style.display = 'none';
  try {
    const resp = await fetch('/api/usuarios/liberar-swagger', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({ senha: document.getElementById('senha').value })
    });
    if (resp.ok) {
      window.location.href = '/swagger-ui.html';
    } else if (resp.status === 401) {
      window.location.href = '/login.html';
      return;
    } else {
      const corpo = await resp.json().catch(() => ({}));
      msg.textContent = corpo.erro || 'Senha inv\u00e1lida.';
      msg.style.display = 'block';
    }
  } catch (erro) {
    msg.textContent = 'Falha de conex\u00e3o com o servidor.';
    msg.style.display = 'block';
  }
});
</script>
</body>
</html>
