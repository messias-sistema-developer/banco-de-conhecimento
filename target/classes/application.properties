# Servidor (8080 costuma estar ocupado em desenvolvimento; 8180 evita conflito)
# No Render, a porta vem da variavel PORT; local usa 8180
server.port=${PORT:8180}

# -------------------------------------------------- banco de dados SQL
# H2 em ARQUIVO: os dados persistem em ./data/banco-conhecimento.mv.db
# Para trocar por MySQL/PostgreSQL depois, veja o README.md
spring.datasource.url=jdbc:h2:file:./data/banco-conhecimento;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA cria/atualiza as tabelas automaticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Console do banco (opcional): http://localhost:8180/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------- limites de upload
# Limite global do multipart precisa ser MAIOR que o limite de video
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# Limites do NEGOCIO (arquivos guardados no banco):
app.upload.foto-max-mb=5
app.upload.video-max-mb=50
app.upload.arquivo-max-mb=10

# Sessao de login expira em 8 horas de inatividade
server.servlet.session.timeout=8h

# -------------------------------------------------- swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
# "Try it out" so e habilitado depois da confirmacao da senha do ADMIN
springdoc.swagger-ui.tryItOutEnabled=false

# Log mais limpo
logging.level.org.hibernate.SQL=warn
